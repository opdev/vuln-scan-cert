apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: authenticate-central
spec:
  params:
    - name: roxctl-version
      type: string
      description: Version of roxctl to use
      default: "4.9.2"
    - name: rox-endpoint
      type: string
      description: Central UI Endpoint
    - name: creds-secret-name
      type: string
      description: Name of the per-run Secret to store the ROX API token in
    - name: pipelinerun-name
      type: string
      description: PipelineRun name, used as the Secret's ownerReference
    - name: pipelinerun-uid
      type: string
      description: PipelineRun UID, used as the Secret's ownerReference
  stepTemplate:
    computeResources: {}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
  volumes:
    - name: shell-scripts
      configMap:
        name: rhacs-shell-scripts
        defaultMode: 0755
    - name: python-scripts
      configMap:
        name: rhacs-python-scripts
    - name: credentials
      emptyDir:
        medium: Memory
  steps:
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: install-roxctl
      env:
        - name: ROXCTL_VERSION
          value: $(params.roxctl-version)
      command: ["/scripts/shell/install-roxctl.sh"]
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
      workingDir: $(workspaces.binaries.path)
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: checksum-roxctl
      command: ["/scripts/shell/checksum-roxctl.sh"]
      env:
        - name: ROXCTL_VERSION
          value: $(params.roxctl-version)
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
      workingDir: $(workspaces.binaries.path)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: authenticate-central
      command: ["/bin/sh", "-c"]
      args:
        - export OCM_TOKEN="$(cat "$OCM_TOKEN_FILE")"; exec python /scripts/python/authenticate-central.py
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: $(workspaces.binaries.path)/ocm-token
        - name: ROX_ENDPOINT
          value: $(params.rox-endpoint)
        - name: ROX_API_TOKEN_FILE
          value: /credentials/rox-api-token
        - name: CREDS_SECRET_NAME
          value: $(params.creds-secret-name)
        - name: PIPELINERUN_NAME
          value: $(params.pipelinerun-name)
        - name: PIPELINERUN_UID
          value: $(params.pipelinerun-uid)
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: test-rox-api-token
      command: ["/bin/sh", "-c"]
      args:
        - export ROX_API_TOKEN="$(cat "$ROX_API_TOKEN_FILE")"; exec /scripts/shell/test-rox-api-token.sh
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: ROX_API_TOKEN_FILE
          value: /credentials/rox-api-token
        - name: ROX_ENDPOINT
          value: $(params.rox-endpoint)
      workingDir: $(workspaces.binaries.path)
  workspaces:
    - description: |
        Binaries
      name: binaries
