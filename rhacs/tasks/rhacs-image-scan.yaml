apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhacs-image-scan
  labels:
    app.kubernetes.io/version: "4.0"
  annotations:
    tekton.dev/categories: Security
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: security, rhacs, roxctl, stackrox
    tekton.dev/displayName: "Red Hat Advanced Cluster Security Image Scan with CSV Export"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Scan an image with Red Hat Advanced Cluster Security (RHACS), generating vulnerability reports in both JSON and CSV formats.

    This task scans images using roxctl and converts the JSON output to CSV format suitable for analysis tools.

    Results are saved to the results workspace for consumption by other tasks.
  params:
    - name: rox-endpoint
      type: string
    - name: creds-secret-name
      type: string
      description: Name of the per-run Secret holding the ROX API token
    - name: image
      type: string
      description: |
        Full name of image to scan.
        Examples: 'gcr.io/rox/sample:5.0-rc1', '$(params.IMAGE)', '$(params.IMAGE)@$(tasks.buildah.results.IMAGE_DIGEST)'
    - name: insecure-skip-tls-verify
      type: string
      description: |
        When set to `"true"`, skip verifying the TLS certs of the Central
        endpoint. Defaults to `"false"`.
      default: "false"
    - name: partner-name
      type: string
      description: Partner name for result file naming
      default: "RedHat"
    - name: scanner-name
      type: string
      description: Scanner name for result file naming
      default: "RHACS"
    - name: scanner-version
      type: string
      description: Scanner version for result file naming
      default: "4.9.2"
  workspaces:
    - name: results
      description: |
        Workspace to store scan results. JSON and CSV files will be written here.
    - name: binaries
      description: |
        Workspace containing the roxctl binary (pre-installed by authenticate-central).
  stepTemplate:
    computeResources: {}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      # Pin a fixed SELinux MCS level so every task that mounts the shared
      # `bin` RWO PVC (provision/authenticate/scan/destroy) runs with the
      # same label. Without this, OpenShift's MustRunAs SCC assigns a unique
      # MCS level per pod; concurrent matrix scan pods then race to relabel
      # the PVC and lock each other out of roxctl (exit 126 / "Permission
      # denied"). Keep this value identical across all four tasks.
      seLinuxOptions:
        level: "s0:c6,c5"
  results:
    - name: results-path
      type: string
      description: >-
        Path to the generated CSV relative to the scan-results workspace root (image subPath/filename)
  volumes:
    - name: shell-scripts
      configMap:
        name: rhacs-shell-scripts
        defaultMode: 0755
    - name: python-scripts
      configMap:
        name: rhacs-python-scripts
  steps:
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: rox-image-scan
      command: ["bash", "/scripts/shell/scan-image.sh"]
      workingDir: $(workspaces.binaries.path)
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
      env:
        - name: ROX_ENDPOINT
          value: $(params.rox-endpoint)
        - name: INSECURE
          value: $(params.insecure-skip-tls-verify)
        - name: IMAGE
          value: $(params.image)
        - name: ROX_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.creds-secret-name)
              key: "rox-api-token"
        - name: RESULTS_PATH
          value: $(workspaces.results.path)
        - name: PARTNER_NAME
          value: $(params.partner-name)
        - name: SCANNER_NAME
          value: $(params.scanner-name)
        - name: SCANNER_VERSION
          value: $(params.scanner-version)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: json-to-csv-conversion
      command: ["python", "/scripts/python/json-to-csv.py"]
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
      env:
        - name: IMAGE
          value: $(params.image)
        - name: RESULTS_PATH
          value: $(workspaces.results.path)
        - name: TASK_RESULT_PATH
          value: $(results.results-path.path)
        - name: PARTNER_NAME
          value: $(params.partner-name)
        - name: SCANNER_NAME
          value: $(params.scanner-name)
        - name: SCANNER_VERSION
          value: $(params.scanner-version)
