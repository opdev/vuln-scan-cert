apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-central
spec:
  params:
    - name: service-account-creds-secret
      type: string
      description: Name of Secret containing Service Account credentials
    - name: cloud-account-id
      type: string
      description: AWS ID used for Central provisioning via ACS CS
    - name: central-aws-region
      type: string
      description: AWS Region where to provision Central
    - name: existing-central-id
      type: string
      description: Existing Central ID to reuse instead of creating a new one
      default: ""
    - name: pipelinerun-uid
      type: string
      description: Unique pipelineRun identifier, used to craft a unique Central name.
    - name: pipelinerun-name
      type: string
      description: PipelineRun name, used as the Secret's ownerReference
    - name: creds-secret-name
      type: string
      description: Name of the per-run Secret to store the OCM token in
  results:
    - name: central-id
      type: string
      description: ID of provisionned central in ACS CS
    - name: rox-endpoint
      type: string
      description: Central UI Endpoint
  stepTemplate:
    computeResources: {}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      # Pin a fixed SELinux MCS level so every task that mounts the shared
      # `bin` RWO PVC (provision/authenticate/scan/destroy) runs with the
      # same label. Without this, OpenShift's MustRunAs SCC assigns a unique
      # MCS level per pod; concurrent matrix scan pods then race to relabel
      # the PVC and lock each other out of roxctl (exit 126 / "Permission
      # denied"). Keep this value identical across all four tasks.
      seLinuxOptions:
        level: "s0:c6,c5"
  volumes:
    - name: shell-scripts
      configMap:
        name: rhacs-shell-scripts
        defaultMode: 0755
    - name: python-scripts
      configMap:
        name: rhacs-python-scripts
    - name: credentials
      emptyDir:
        medium: Memory
  steps:
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: install-ocm
      command: ["/scripts/shell/install-ocm.sh"]
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
      workingDir: $(workspaces.binaries.path)
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: ocm-login
      command: ["/scripts/shell/ocm-token.sh"]
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.service-account-creds-secret)
              key: "client-id"
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: $(params.service-account-creds-secret)
              key: "client-secret"
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
      workingDir: $(workspaces.binaries.path)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: provision-central
      results:
        - name: central-id
          type: string
          description: ID of provisionned central in ACS CS
      command: ["/bin/sh", "-c"]
      args:
        - export OCM_TOKEN="$(cat "$OCM_TOKEN_FILE")"; exec python /scripts/python/provision-central.py
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
        - name: CREDS_SECRET_NAME
          value: $(params.creds-secret-name)
        - name: PIPELINERUN_NAME
          value: $(params.pipelinerun-name)
        - name: PIPELINERUN_UID
          value: $(params.pipelinerun-uid)
        - name: CLOUD_ACCOUNT_ID
          value: $(params.cloud-account-id)
        - name: CENTRAL_AWS_REGION
          value: $(params.central-aws-region)
        - name: EXISTING_CENTRAL_ID
          value: $(params.existing-central-id)
        - name: STEP_RESULT_PATH
          value: $(step.results.central-id.path)
        - name: TASK_RESULT_PATH
          value: $(results.central-id.path)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: wait-for-central-ready
      command: ["/bin/sh", "-c"]
      args:
        - export OCM_TOKEN="$(cat "$OCM_TOKEN_FILE")"; exec python /scripts/python/wait-for-central-ready.py
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
        - name: CENTRAL_ID
          value: $(steps.provision-central.results.central-id)
        - name: ROX_ENDPOINT_PATH
          value: $(results.rox-endpoint.path)
  workspaces:
    - description: |
        Binaries
      name: binaries
