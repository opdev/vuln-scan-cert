apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: destroy-central
spec:
  params:
    - name: central-id
      type: string
      description: ID of provisioned central in ACS
  stepTemplate:
    computeResources: {}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      # Pin a fixed SELinux MCS level so every task that mounts the shared
      # `bin` RWO PVC (provision/authenticate/scan/destroy) runs with the
      # same label. Without this, OpenShift's MustRunAs SCC assigns a unique
      # MCS level per pod; concurrent matrix scan pods then race to relabel
      # the PVC and lock each other out of roxctl (exit 126 / "Permission
      # denied"). Keep this value identical across all four tasks.
      seLinuxOptions:
        level: "s0:c6,c5"
  volumes:
    - name: shell-scripts
      configMap:
        name: rhacs-shell-scripts
        defaultMode: 0755
    - name: python-scripts
      configMap:
        name: rhacs-python-scripts
    - name: credentials
      emptyDir:
        medium: Memory
  steps:
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: install-ocm
      command: ["/scripts/shell/install-ocm.sh"]
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
      workingDir: $(workspaces.binaries.path)
    - image: registry.redhat.io/ubi8/ubi-minimal
      name: ocm-login
      command: ["/scripts/shell/ocm-token.sh"]
      volumeMounts:
        - name: shell-scripts
          mountPath: /scripts/shell
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: rh-openid-credentials
              key: "client-id"
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: rh-openid-credentials
              key: "client-secret"
      workingDir: $(workspaces.binaries.path)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: destroy-central
      command: ["/bin/sh", "-c"]
      args:
        - export OCM_TOKEN="$(cat "$OCM_TOKEN_FILE")"; exec python /scripts/python/destroy-central.py
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
        - name: CENTRAL_ID
          value: $(params.central-id)
    - image: image-registry.openshift-image-registry.svc:5000/default/python3-with-requests:latest
      name: wait-for-central-delete
      command: ["/bin/sh", "-c"]
      args:
        - export OCM_TOKEN="$(cat "$OCM_TOKEN_FILE")"; exec python /scripts/python/wait-for-central-delete.py
      volumeMounts:
        - name: python-scripts
          mountPath: /scripts/python
          readOnly: true
        - name: credentials
          mountPath: /credentials
      env:
        - name: OCM_TOKEN_FILE
          value: /credentials/ocm-token
        - name: CENTRAL_ID
          value: $(params.central-id)
  workspaces:
    - description: |
        Binaries
      name: binaries
